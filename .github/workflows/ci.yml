# Builds the x86_64 AppImage, and attaches it to a release when a tag is pushed.
#
# Everything runs through Nix, for the same reason the Makefile does: liblogos
# and every module are Nix-built, and the addon must be compiled against the
# exact Qt that liblogos was built against. A GitHub runner's system Qt would
# reproduce the `Qt_6_PRIVATE_API not found` failure documented in the README.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed by the release job to upload the AppImage asset

jobs:
  appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A standard runner has ~14 GB free, and this job wants most of it: the
      # Nix store for liblogos + Waku + RLN, an Electron download, and a 300 MB+
      # AppImage. Reclaiming the preinstalled toolchains nobody here uses buys
      # ~20 GB and costs a few seconds.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # patchelf is what rewrites the bundle's rpaths (scripts/bundle-runtime.js),
      # and `make bundle` reaches for it as `nix shell nixpkgs#patchelf`. Doing
      # that lazily would resolve and download nixpkgs an hour into the job,
      # right before the finish line. Fetched here instead, so a registry or
      # network problem fails in the first minute.
      - name: Prefetch patchelf
        run: nix build --no-link nixpkgs#patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Build liblogos and every module package. These are the slow steps —
      # delivery pulls in Waku and RLN, which compile from source.
      - name: Build liblogos
        run: nix build --no-write-lock-file 'github:logos-co/logos-liblogos' -o ./liblogos

      # --no-write-lock-file: the delivery-module flake carries lock entries Nix
      # wants to refresh, and a flake fetched from GitHub is read-only, so the
      # attempt is a hard error ("cannot write modified lock file"). The flag
      # keeps the resolution in memory. It does not weaken pinning — every input
      # still resolves through the flake's own committed lock.
      - name: Build package manager and modules
        run: |
          nix build --no-write-lock-file 'github:logos-co/logos-package-manager#cli' -o lgpm
          nix build --no-write-lock-file 'github:logos-co/logos-capability-module#lgx' -o cap-lgx
          nix build --no-write-lock-file 'github:logos-co/logos-delivery-module#lgx' -o delivery-lgx
          nix build --no-write-lock-file 'github:logos-co/logos-delivery-module#liblogos_rln_module-lgx' -o rln-lgx
          nix build --no-write-lock-file 'github:logos-co/logos-delivery-module#liblogos_lez_rln_module-lgx' -o lez-rln-lgx
          nix build --no-write-lock-file 'github:logos-co/logos-delivery-module#lez_core-lgx' -o lez-core-lgx

      # Order does not matter to lgpm — it installs into the modules dir, and
      # core resolves the dependency graph at load time.
      - name: Install modules
        run: make modules

      # --ignore-scripts stops THIS package's postinstall, which would run
      # node-gyp outside the dev shell with LOGOS_LIBLOGOS_ROOT unset. But it
      # also skips electron's own postinstall, which is what downloads the
      # Electron binary — without it, `npx electron` dies with "Electron failed
      # to install correctly". So the download is run explicitly afterwards.
      - name: Install JS dependencies
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      # Proves the module actually loads before anything is packaged, so a
      # broken AppImage is never published. Electron needs an X display even
      # with no window on screen, hence xvfb-run on a headless runner.
      - name: Verify delivery module loads
        run: xvfb-run --auto-servernum make verify LIBLOGOS_FLAKE=github:logos-co/logos-liblogos

      - name: Build AppImage
        run: make appimage LIBLOGOS_FLAKE=github:logos-co/logos-liblogos

      # The real test: run the PACKAGED app with no dev shell and no
      # LD_LIBRARY_PATH, so it must resolve everything through its own bundled
      # rpaths. A bundle that still refers to /nix/store fails here rather than
      # on a user's machine.
      - name: Verify the AppImage starts delivery_module
        run: xvfb-run --auto-servernum make verify-appimage

      - uses: actions/upload-artifact@v4
        with:
          name: liblogos-electron-poc-x86_64.AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      # On a tag, publish the AppImage as a release asset.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
