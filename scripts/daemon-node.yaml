# logosctl daemon config for the core_service probe.
#
# Plain TCP on loopback, so logos-js-sdk (which speaks tcp / tcp_ssl, not the
# local socket) can reach the daemon's RPC gateway. insecure_tcp must be set
# explicitly: the daemon refuses plaintext listeners otherwise, and the docs
# warn that plaintext tcp off-loopback puts tokens on the wire in cleartext.
# 127.0.0.1 only, for a probe.
insecure_tcp: true

# TCP ONLY, deliberately.
#
# Listing `local` and `tcp` together validates, and the daemon then dies
# silently during startup — its log stops after capability_module loads, with
# no ports and no socket. TCP alone binds both ports and the daemon stays up,
# so that is what this probe uses. The cost is that logosctl's own client can
# no longer find the daemon (it dials the local endpoint), so the CLI reports
# NO_DAEMON while this config is installed. Fine here: the point is to test the
# JS client, not the CLI.
modules:
  # The RPC gateway. logosctl's own client talks only to this, and it proxies
  # every module call — callModuleMethod(module, method, args).
  core_service:
    - protocol: tcp
      host: 127.0.0.1
      port: 7001
      codec: json

  # Its own port: two QTcpServers cannot share an address:port, and a client
  # dials capability_module separately for a per-target token.
  capability_module:
    - protocol: tcp
      host: 127.0.0.1
      port: 7002
      codec: json
