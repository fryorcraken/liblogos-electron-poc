<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>liblogos · Electron PoC</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 32px;
        font: 14px/1.6 system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-height: 100vh;
        box-sizing: border-box;
      }
      h1 { font-size: 17px; margin: 0; }
      .sub { color: GrayText; margin: 4px 0 0; }
      #status {
        font-size: 15px;
        font-weight: 600;
        padding: 14px 16px;
        border-radius: 8px;
        border: 1px solid ButtonBorder;
      }
      #status[data-state='idle']    { color: GrayText; }
      #status[data-state='working'] { color: #b7791f; }
      #status[data-state='ok']      { color: #217a3c; }
      #status[data-state='error']   { color: #c0392b; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      button { padding: 9px 18px; font: inherit; font-weight: 600; }
      button:disabled { opacity: 0.5; }
      button.secondary { font-weight: 400; opacity: 0.85; }
      /* The live half: connection state and a running event count, so the pane
         is not the only evidence that something is still happening. */
      #conn {
        display: flex;
        gap: 8px;
        align-items: baseline;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      #conn .label { color: GrayText; }
      #conn .label:not(:first-child) { margin-left: 12px; }
      #connState { font-weight: 600; }
      #connState[data-state='Connected'] { color: #217a3c; }
      #connState[data-state='PartiallyConnected'] { color: #b7791f; }
      #connState[data-state='Disconnected'] { color: #c0392b; }
      pre {
        flex: 1;
        background: color-mix(in srgb, Canvas 92%, CanvasText);
        border-radius: 8px;
        padding: 12px 14px;
        margin: 0;
        overflow: auto;
        white-space: pre-wrap;
        font-size: 12px;
        min-height: 180px;
      }
      .err { color: #c0392b; }
      /* Core's own spdlog output, as opposed to this page's commentary. */
      .native { color: color-mix(in srgb, CanvasText 72%, Canvas); }
      .native:first-letter { font-weight: 600; }
    </style>
  </head>
  <body>
    <div>
      <h1>liblogos · Electron PoC</h1>
      <p class="sub">
        Runs a <code>logosctl</code> daemon beside the app and drives the Logos
        <code>delivery</code> module through its <code>core_service</code>
        gateway — <code>createNode()</code>, <code>start()</code>, and a live
        event stream. The gateway is what lets the Qt-free JS SDK call a module;
        see <code>NEXT.md</code>.
      </p>
    </div>

    <div id="status" data-state="idle">Ready.</div>

    <div class="row">
      <button id="start">Start Waku node</button>
      <button id="load" class="secondary">Load module only (0.1.0)</button>
    </div>

    <div id="conn" hidden>
      <span class="label">connection</span>
      <span id="connState">—</span>
      <span class="label">events</span>
      <span id="eventCount">0</span>
    </div>

    <pre id="log"></pre>

    <script src="./renderer.js"></script>
  </body>
</html>
